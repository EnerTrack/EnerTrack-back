apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  labels:
    app: {{ .Chart.Name }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  application.properties: |
    #configuracion general
    spring.application.name=msvc-users
    server.port=8001

    #Base de datos
    spring.datasource.url={{ .Values.env.SPRING_DATASOURCE_URL }}
    spring.datasource.username={{ .Values.env.SPRING_DATASOURCE_USERNAME }}
    spring.datasource.password={{ .Values.env.SPRING_DATASOURCE_PASSWORD }}
    spring.datasource.driver-class-name=org.postgresql.Driver

    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    #Spring cloud kubernetes

    # Activa la integración con Kubernetes
    spring.cloud.kubernetes.enabled=true

    #ConfigMap local
    spring.cloud.config.enabled=false

    # Service Discovery (para comunicarse entre microservicios)
    spring.cloud.kubernetes.discovery.enabled=true
    spring.cloud.kubernetes.discovery.all-namespaces=false

    # Load balance
    spring.cloud.loadbalancer.ribbon.enabled=false
    spring.cloud.loadbalancer.retry.enabled=true

    #Habilitar actuator
    management.endpoint.health.probes.enabled=true
    management.endpoints.web.exposure.include=health,info
    management.endpoint.health.show-details=always

    #log
    logging.level.org.springframework=INFO
    logging.level.org.springframework.web=DEBUG
    logging.level.org.hibernate.SQL=DEBUG

