#configuracion general
spring.application.name=msvc-users
server.port=8001

#Base de datos
spring.datasource.url=jdbc:mysql://mysql9:3306/msvc_energy_db
spring.datasource.username=root
spring.datasource.password=Rig0bert0.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Spring cloud kubenetes

# Activa la integración con Kubernetes
spring.cloud.kubernetes.enabled=true

#ConfigMap local
spring.cloud.config.enabled=false

# Service Discovery (para comunicarse entre microservicios)
spring.cloud.kubernetes.discovery.enabled=true
spring.cloud.kubernetes.discovery.all-namespaces=false

# Laod balance
spring.cloud.loadbalancer.ribbon.enabled=false
spring.cloud.loadbalancer.retry.enabled=true

#log
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
